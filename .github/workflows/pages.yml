name: Deploy Pages
# Publishes ONE GitHub Pages site with three surfaces:
#   /              -> the admin panel (mock-only demo, MSW in-browser)
#   /storybook/    -> the static Storybook
#   /report.html   -> the executive report
# One-time setup by the repo owner: Settings -> Pages -> Source = "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege for the deploy: read the repo, write Pages, mint the OIDC token.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Cancel any older queued/in-flight publish so a newer
# push to main always wins and stale deploys never pile up behind the lock.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install
        run: npm ci
      # Base = `/<repo>/` so Vite emits base-prefixed asset URLs and the router
      # picks up `import.meta.env.BASE_URL`. Scoped to THIS step only.
      - name: Build app
        run: npm run build
        env:
          APP_BASE: /${{ github.event.repository.name }}/
      # Storybook's static output uses relative asset URLs, so it works under
      # `/storybook/` without a base (APP_BASE is intentionally NOT set here).
      - name: Build Storybook
        run: npm run build-storybook -- -o dist/storybook
      - name: Assemble site (report + SPA fallback + nojekyll)
        run: |
          cp docs/report.html dist/report.html
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
