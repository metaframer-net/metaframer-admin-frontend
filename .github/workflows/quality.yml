name: Quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install
        run: npm ci
      # Playwright must be installed BEFORE the test step: `npm run test`
      # (vitest) runs BOTH the unit project AND the browser-based Storybook
      # project, which needs Chromium (+ headless shell, installed by default).
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit + Storybook tests
        run: npm run test -- --run
      - name: Build
        run: npm run build
      - name: Bundle-size budget
        run: node scripts/check-bundle-size.mjs
      - name: Build Storybook
        run: npm run build-storybook
